# =============================================================================
# Tabla de enrutamiento Acta → Hilo — EJEMPLO
# =============================================================================
# Reemplazá este archivo con las señales de tu cantón: nombres de lugares,
# instituciones, rutas, programas, leyes, etc.
#
# Matching:
#   1. Aplicar primero `anti_enrutamientos`.
#   2. Contar señales de `enrutamiento_principal` (substring case-insensitive).
#   3. Gana el Hilo con más señales. Empate: gana el primero.
#   4. Si ningún Hilo acumula señales → `## Propuestas de Hilo nuevo`.

version: 1
municipio: "Ejemplo"
hilos_raiz: "hilos"

anti_enrutamientos:
  - tema: "modificación presupuestaria"
    va_a: "Presupuesto, Finanzas, Tarifas y Planificación"
    no_a:
      - "Concejo Municipal y Funcionamiento"

  - tema: "agua"
    va_a: "Agua Potable, AyA y ASADAS"
    no_a:
      - "Salud Pública, CCSS, EBAIS y Campañas"

  - tema: "licitación de obra vial"
    va_a: "Contratación, Activos y Mercado Municipal"
    no_a:
      - "Movilidad, Red Vial y Transporte Público"

enrutamiento_principal:
  - bloque: "Gobierno Local y Gobernanza"
    hilo: "Concejo Municipal y Funcionamiento"
    señales:
      - "composición del concejo"
      - "elección de directorio"
      - "quórum"
      - "presidencia"
      - "vicepresidencia"
      - "comisiones permanentes"
      - "reglamento interno"
      - "asistencia"
      - "licencias"
      - "capacitación"
      - "plan de gobierno"

  - bloque: "Gobierno Local y Gobernanza"
